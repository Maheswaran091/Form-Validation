<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="containers">
        <div id="right"><a href="index.html"><i class="bi bi-house-door"></i></a></div>
        <div id="left"><a href="Login.html"><button class="but">LogIn</button></a></div>
        <div id="left"><a href="Register.html"><button class="but">SignIn</button></a></div>
    </div>
    <div class="container">
        
        <form action="" id="form">
            <h1>LogIn</h1>
            <div id="input-group">
                <label for="UserName">UserName</label>
                <input type="text" id="username" name="uername" placeholder="UserName">
                <div class="error"></div>
            </div>
            <div id="input-group">
                <label for="Mail">Email</label>
                <input type="text" id="Email" name="Email" placeholder="Enter Mail">
                <div class="error"></div>
            </div>
            <div id="input-group">
                <label for="Password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter Password">
                <div class="error"></div>
            </div>
            <div id="input-group" style="display: none;">
                <label for="cPassword">Confirm Password</label>
                <input type="password" id="cpassword" name="cpassword" placeholder="Enter Confirm Password">
                <div class="error"></div>
            </div>
            <button id="btn">LogIn</button>
            <a href="LogIns.html"><h3><span id="span">SignIn</span></h3></a>
        </form>
    </div>
    
</body>
</html>
