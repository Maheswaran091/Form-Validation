<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<style>
    body{
        margin: 0%;
        padding: 0%;
        background-color: aliceblue;
    }
    #containers{
        width: 100vw;
        height: 100px;
        box-shadow: 2px 2px 10px 2px;
        display: flex;
        justify-content: space-around;
        align-items: center;
    }
    #right{
        font-size: 30px;
    }
    #left{
        font-size: 30px;
    }
    .but{
        cursor: pointer;
        border:none;
        padding: 10px;
        border-radius: 20px;
        font-size: 20px;
        background-color: transparent;
    }
    #main{
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 80vh;
    }
    span{
        font-size: 100px;
        background-image: url(christmas.jpg);
        background-clip:text;
        color: transparent;
        animation: animate 20s linear infinite;
    }
    #formletter{
        font-size: 20px;
        background-image: url(Figurines,vases&more.jpg);
        background-clip:text;
        color: transparent;
        animation: animate 20s linear infinite;
    }
    @keyframes animate {
        from{
            background-position: -500px;
        }
    }

</style>
<body>
    <div id="containers">
        <div id="right"><a href="index.html"><i class="bi bi-house-door"></i></a></div>
        <div id="left"><a href="Login.html"><button class="but">LogIn</button></a></div>
        <div id="left"><a href="Register.html"><button class="but">SignIn</button></a></div>
    </div>
    <marquee loop="-1" behavior="alternate" direction="right" scrollamount="10"><h2 id="formletter">This is the Form Validation page so click the Login or Signin</h2></marquee>
    <div id="main">
        <span>Happy Home</span>
    </div>
</body>
</html>
